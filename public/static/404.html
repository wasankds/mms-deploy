<head>

  <link rel="stylesheet" href="/css/utils.css">

  <title>404</title>
  <style>
    body{
      margin:0;
      font-family: 'Kanit', sans-serif;
      background-color: #222;

    }
    #ctn h1:first-child{

    a:link {color: white; text-decoration: none ;}

<body>
  <div id="ctn">
    <h1>404 - Page Not Found</h1>

      <i class="fc-white fas fa-home mg-r-xl"></i>
